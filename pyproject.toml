[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiranaos"
version = "0.1.0"
description = "KiranaOS - Autonomous Zero-Click Store Operator for Neighborhood Kirana Stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "supabase>=2.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
